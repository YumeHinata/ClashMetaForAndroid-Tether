name: Build APK (Two-Stage)

on:
  workflow_dispatch:
  push:
    branches: [ main, master, feature/* ]
  pull_request:
    branches: [ main, master ]

jobs:
  # Stage 1: Build tetherpath.aar via gomobile
  build-aar:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'
        cache: false

    - name: Install gomobile
      run: |
        go install golang.org/x/mobile/cmd/gomobile@latest
        go install golang.org/x/mobile/cmd/gobind@latest
        echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
        gomobile init

    - name: Cache gomobile output
      id: cache-aar
      uses: actions/cache@v4
      with:
        path: shizuku-tether/libs/tetherpath.aar
        key: ${{ runner.os }}-aar-${{ hashFiles('shizuku-tether/src/main/golang/**') }}

    - name: Build tetherpath AAR with gomobile
      if: steps.cache-aar.outputs.cache-hit != 'true'
      run: |
        TETHERPATH_LIBS_DIR=$(pwd)/shizuku-tether/libs
        mkdir -p "$TETHERPATH_LIBS_DIR"
        cd shizuku-tether/src/main/golang/tetherpath
        gomobile bind -v -target=android -androidapi=21 -o="$TETHERPATH_LIBS_DIR/tetherpath.aar" .
        ls -lh "$TETHERPATH_LIBS_DIR/"

    - name: Upload AAR artifact
      if: steps.cache-aar.outputs.cache-hit != 'true'
      uses: actions/upload-artifact@v4
      with:
        name: tetherpath-aar
        path: shizuku-tether/libs/tetherpath.aar
        retention-days: 1

  # Stage 2: Build full APK using cached/downloaded AAR
  build-apk:
    needs: build-aar
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Android SDK
      run: |
        echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" "ndk;25.2.9519653"
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV
        echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV

    - name: Download AAR from Stage 1 or use cache
      uses: actions/download-artifact@v4
      with:
        name: tetherpath-aar
        path: shizuku-tether/libs/
      continue-on-error: true

    - name: Fallback: rebuild AAR if download failed
      if: ${{ !env.ACT && !steps.download.outputs.download-path }}
      run: |
        go install golang.org/x/mobile/cmd/gomobile@latest
        echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
        gomobile init
        TETHERPATH_LIBS_DIR=$(pwd)/shizuku-tether/libs
        mkdir -p "$TETHERPATH_LIBS_DIR"
        cd shizuku-tether/src/main/golang/tetherpath
        gomobile bind -v -target=android -androidapi=21 -o="$TETHERPATH_LIBS_DIR/tetherpath.aar" .

    - name: Verify AAR exists
      run: |
        ls -lh shizuku-tether/libs/tetherpath.aar || { echo "AAR not found!"; exit 1; }

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Create local.properties
      run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

    - name: Create signing.properties (debug keystore)
      run: |
        rm -f release.keystore debug.keystore
        keytool -genkey -v -keystore release.keystore -alias androiddebugkey \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -storepass android -keypass android \
          -dname "CN=Android Debug,O=Android,C=US"
        cat > signing.properties << EOF
        keystore.path=release.keystore
        keystore.password=android
        key.alias=androiddebugkey
        key.password=android
        EOF

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew app:assembleMetaDebug --no-daemon
      env:
        ORG_GRADLE_PROJECT_custom_application_id: ${{ vars.CUSTOM_APPLICATION_ID || '' }}

    - name: List APK files
      if: success()
      run: |
        echo "=== Generated APK files ==="
        find app/build/outputs/apk -name "*.apk" -type f | sort

    - name: Upload arm64-v8a APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: cmfa-meta-debug-arm64-v8a
        path: app/build/outputs/apk/meta/debug/*arm64-v8a*.apk
        retention-days: 30
        if-no-files-found: ignore

    - name: Upload armeabi-v7a APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: cmfa-meta-debug-armeabi-v7a
        path: app/build/outputs/apk/meta/debug/*armeabi-v7a*.apk
        retention-days: 30
        if-no-files-found: ignore

    - name: Upload x86 APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: cmfa-meta-debug-x86
        path: app/build/outputs/apk/meta/debug/*x86*.apk
        retention-days: 30
        if-no-files-found: ignore

    - name: Upload x86_64 APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: cmfa-meta-debug-x86_64
        path: app/build/outputs/apk/meta/debug/*x86_64*.apk
        retention-days: 30
        if-no-files-found: ignore

    - name: Upload universal APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: cmfa-meta-debug-universal
        path: app/build/outputs/apk/meta/debug/*universal*.apk
        retention-days: 30
        if-no-files-found: ignore

    - name: Summary
      if: success()
      run: |
        echo "## Build Success! :rocket:" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Download APK" >> $GITHUB_STEP_SUMMARY
        echo "APK files are available in the Artifacts section of this workflow run." >> $GITHUB_STEP_SUMMARY
