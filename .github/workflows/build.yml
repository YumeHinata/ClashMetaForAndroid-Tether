name: Build APK

on:
  # 手动触发
  workflow_dispatch:
  # 推送到特定分支时触发（可选）
  push:
    branches: [ main, master, feature/* ]
  # Pull Request 时触发（可选）
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Android SDK
      run: |
        # GitHub Actions ubuntu-latest already has Android SDK installed
        # Set environment variables for Android SDK
        echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
        
        # Install required SDK components including NDK
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" "ndk;25.2.9519653"
        
        # Set NDK path
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV
        echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'
        cache: false

    - name: Install gomobile
      run: |
        go install golang.org/x/mobile/cmd/gomobile@latest
        go install golang.org/x/mobile/cmd/gobind@latest
        echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
        
        # Initialize gomobile
        gomobile init

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Create local.properties
      run: |
        echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

    - name: Create signing.properties (debug keystore)
      run: |
        # 删除可能存在的旧 keystore
        rm -f release.keystore debug.keystore
        
        # 生成临时 release keystore（用于 CI 签名）
        keytool -genkey -v -keystore release.keystore -alias androiddebugkey \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -storepass android -keypass android \
          -dname "CN=Android Debug,O=Android,C=US"
        
        # 创建签名配置
        cat > signing.properties << EOF
        keystore.path=release.keystore
        keystore.password=android
        key.alias=androiddebugkey
        key.password=android
        EOF
        
        echo "=== Keystore created ==="
        ls -lh release.keystore

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build tetherpath AAR with gomobile
      run: |
        # Build the Go library into AAR before Gradle dependency resolution
        echo "=== Starting in: $(pwd) ==="
        TETHERPATH_LIBS_DIR=$(pwd)/shizuku-tether/libs
        echo "=== Output directory: $TETHERPATH_LIBS_DIR ==="
        mkdir -p "$TETHERPATH_LIBS_DIR"
        echo "=== Created directory, listing: ==="
        ls -la shizuku-tether/
        
        echo "=== Changing to golang source directory ==="
        cd shizuku-tether/src/main/golang/tetherpath
        echo "=== Now in: $(pwd) ==="
        
        echo "=== Running gomobile bind ==="
        gomobile bind -v -target=android -androidapi=21 -o="$TETHERPATH_LIBS_DIR/tetherpath.aar" .
        
        echo "=== Gomobile exit code: $? ==="
        echo "=== Checking if AAR exists ==="
        ls -lh "$TETHERPATH_LIBS_DIR/"
        
        echo "=== Going back to project root ==="
        cd ../../../../..
        echo "=== Now in: $(pwd) ==="
        echo "=== Final check ==="
        ls -lh shizuku-tether/libs/

    - name: Build with Gradle
      run: ./gradlew app:assembleAlphaRelease --no-daemon
      env:
        ORG_GRADLE_PROJECT_custom_application_id: ${{ vars.CUSTOM_APPLICATION_ID || '' }}

    - name: Upload APK artifacts
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: APK-${{ github.sha }}
        path: |
          app/build/outputs/apk/**/*.apk
        retention-days: 30
        if-no-files-found: warn

    - name: Upload build reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: build-reports-${{ github.sha }}
        path: |
          **/build/reports/
          **/build/outputs/
        retention-days: 7
        if-no-files-found: ignore

    - name: Summary
      if: success()
      run: |
        echo "## Build Success! :rocket:" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Download APK" >> $GITHUB_STEP_SUMMARY
        echo "APK files are available in the Artifacts section of this workflow run." >> $GITHUB_STEP_SUMMARY
